[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "active4oak-negscope2"
version = "0.1.0"
description = "把候选项映射到类别上，算出提示词的否定范围的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "active4oak" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://active4oak.github.io"
Repository = "https://github.com/active4oak/negscope2"
Issues = "https://github.com/active4oak/negscope2/issues"

[project.scripts]
negscope2 = "negscope2:main"

[tool.setuptools]
py-modules = ["negscope2"]
